<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEA HUNT — TikTok LIVE Overlay</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;color:#f1fbff;font:16px system-ui,sans-serif}
#wrap{width:min(100%,560px);margin:0 auto;padding:12px;text-shadow:0 2px 4px #00121d}
.panel{background:linear-gradient(145deg,#071d2beF,#0b3043eF);border:1px solid #55cde0aa;border-radius:16px;padding:14px;box-shadow:0 8px 28px #00121d88}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:#69e6f2}.status{font-size:12px;color:#b6dce8}.turn{margin:9px 0;padding:8px 10px;background:#173c50;border-radius:9px;color:#ffe08a;font-weight:700}
#boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.board{background:#061b29;border:1px solid #2d6075;border-radius:11px;padding:9px}.boardhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.cell{aspect-ratio:1;border-radius:3px;background:#15536e;border:1px solid #287b96;display:grid;place-items:center;font-size:10px}.hit{background:radial-gradient(circle,#ffe29a,#ff742c 45%,#8e2939 80%)}.miss{background:#394d58;color:#c6d4db}.foot{font-size:12px;color:#c0d8e2;margin-top:9px;line-height:1.4}.feed{max-height:100px;overflow:hidden;font-size:12px;color:#c7e5ee;margin-top:8px}.feed div{padding:2px 0}.test{display:flex;gap:6px;margin-top:8px}.test input{min-width:0;flex:1;background:#061827;color:white;border:1px solid #3d7084;border-radius:7px;padding:8px}.test button{background:#176b83;color:white;border:0;border-radius:7px;padding:8px 12px;font-weight:700}
</style></head>
<body><div id="wrap"><section class="panel">
<div class="top"><div class="brand">⚓ SEA HUNT LIVE</div><div class="status" id="connection">Connecting…</div></div>
<div class="turn" id="turn">Connecting to battle room…</div>
<div id="boards"></div>
<div class="foot" id="help">TikTok viewers: type <b>!fire B7</b> to fire at a coordinate when it is the LIVE crew's turn.</div>
<div class="feed" id="feed"></div>
<div class="test"><input id="testCommand" placeholder="Test command: !fire B7"><button id="testBtn">Test</button></div>
</section></div>
<script>
const qs=new URLSearchParams(location.search),room=(qs.get('room')||'').trim().toUpperCase(),captain=qs.get('name')||'TikTok Crew';
const $=id=>document.getElementById(id);let peer,conn,myId=null,players=[],shots={},turn=0,started=false,over=false,connected=false,lastShotByUser={};
function status(s){$('connection').textContent=s}
function log(s){let e=document.createElement('div');e.textContent=s;$('feed').prepend(e);while($('feed').children.length>5)$('feed').lastChild.remove()}
function cellNum(coord){let m=/^([A-J])\s*(10|[1-9])$/i.exec(coord);return m?(Number(m[2])-1)*10+m[1].toUpperCase().charCodeAt(0)-65:-1}
function fire(coord,user){let n=cellNum(coord);if(n<0){log(user+': use a coordinate like B7');return}if(!connected||!started||over){log('Battle is not accepting shots right now.');return}if(players[turn]?.id!==myId){log('Not the LIVE crew turn yet.');return}const targets=players.filter(p=>p.id!==myId&&!p.sunk);if(!targets.length){log('No enemy ships remain.');return}let target=targets[0];for(const p of targets){const rec=shots[p.id]||{hit:[],miss:[]};if(!rec.hit.includes(n)&&!rec.miss.includes(n)){target=p;break}}const rec=shots[target.id]||{hit:[],miss:[]};if(rec.hit.includes(n)||rec.miss.includes(n)){log(user+': '+coord+' was already fired at.');return}conn.send({type:'fire',target:target.id,cell:n});log(user+' fired at '+coord+'!')}
function handleChat(data){const message=String(data.comment||data.content||'').trim();if(!message)return;const m=/^!fire\s+([A-J]\s*(?:10|[1-9]))$/i.exec(message);const who=data.user?.nickname||data.nickname||data.user?.uniqueId||'Viewer';if(/^!help$/i.test(message)){log(who+': Type !fire B7 to shoot when LIVE crew turn appears.');return}if(m){const key=data.user?.uniqueId||data.userId||who.toLowerCase();const now=Date.now();if(now-(lastShotByUser[key]||0)<2500)return;lastShotByUser[key]=now;fire(m[1],who)}}
function render(s){players=s.players||players;shots=s.shots||shots;turn=Number.isInteger(s.turn)?s.turn:turn;started=!!s.started;over=!!s.over;const current=players[turn];if(over){const winner=players.find(p=>!p.sunk);$('turn').textContent=winner?(winner.id===myId?'TikTok LIVE crew wins!':winner.name+' wins!'):'Battle over'}else if(!started){$('turn').textContent='Waiting for host to start the battle…'}else if(current?.id===myId){$('turn').textContent='🔥 TIKTOK LIVE CREW TURN — viewers type !fire B7'}else{$('turn').textContent='⚓ '+(current?.name||'Opponent')+' is taking a shot…'}
$('boards').innerHTML='';players.filter(p=>p.id!==myId).forEach(p=>{const box=document.createElement('div');box.className='board';const head=document.createElement('div');head.className='boardhead';const name=document.createElement('b');name.textContent=p.name+(p.sunk?' — SUNK':'');const score=document.createElement('span');score.textContent=p.damage+'/'+3+' hits';head.append(name,score);box.append(head);const grid=document.createElement('div');grid.className='grid';const rec=shots[p.id]||{hit:[],miss:[]};for(let i=0;i<100;i++){const b=document.createElement('div');b.className='cell';if(rec.hit.includes(i)){b.classList.add('hit');b.textContent='✹'}else if(rec.miss.includes(i)){b.classList.add('miss');b.textContent='·'}grid.append(b)}box.append(grid);$('boards').append(box)})}
function connect(){if(!room){status('Add room code in URL');$('turn').textContent='Set ?room=YOURROOMCODE in the overlay URL.';return}peer=new Peer();peer.on('open',()=>{conn=peer.connect('bs-'+room.toLowerCase(),{reliable:true,metadata:{name:captain}});conn.on('open',()=>{connected=true;status('Connected to room '+room);log('TikTok LIVE crew joined the battle.');conn.send({type:'join',name:captain})});conn.on('data',d=>{if(d.type==='welcome'){myId=peer.id;return}if(d.type==='full'){status('Room is full');log('The battle already has 4 players.');return}if(d.type==='state'){if(!myId)myId=peer.id;render(d)}});conn.on('close',()=>{connected=false;status('Disconnected — refresh overlay')});conn.on('error',()=>status('Room connection error'))});peer.on('error',e=>status('Peer error: '+e.type))}
let chatSocket;function connectTikFinity(){try{chatSocket=new WebSocket('ws://localhost:21213/');chatSocket.onopen=()=>{status(connected?'Room + TikFinity connected':'TikFinity connected · joining room');log('TikFinity chat connected.');};chatSocket.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.event==='chat')handleChat(msg.data||{})}catch(_){}};chatSocket.onclose=()=>{status('TikFinity offline — start desktop app');setTimeout(connectTikFinity,4000)};chatSocket.onerror=()=>{status('Start TikFinity Desktop App on this PC')}}catch(_){status('Could not connect to TikFinity')}} 
$('testBtn').onclick=()=>{const m=/^!fire\s+([A-J]\s*(?:10|[1-9]))$/i.exec($('testCommand').value.trim());if(m)fire(m[1],'Local test');else log('Try a command like !fire B7')};
if(room)connect();connectTikFinity();
</script></body></html>
